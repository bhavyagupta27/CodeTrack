<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CodeTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark sticky-top" id="navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">CodeTrack</a>
  </div>
</nav>
<section class="auth-section py-5">
  <div class="container">
    <div class="auth-card mx-auto">
      <h2 class="fw-bold mb-2">Welcome Back 👋</h2>
      <p class="text-secondary mb-4">Login to continue your placement journey.</p>
      <form id="loginForm">
        <label class="form-label">Email</label>
        <input type="email" class="form-control mb-3" id="email" placeholder="Enter your email" required>
        <label class="form-label">Password</label>
        <input type="password" class="form-control mb-2" id="password" placeholder="Enter your password" required>
        <button type="button" class="btn btn-sm btn-outline-light mb-3" id="togglePassword">Show Password</button>
        <button type="submit" class="btn btn-primary w-100">Login 🚀</button>
      </form>
      <p class="small text-secondary mt-4 mb-0">Demo account: admin@gmail.com / 123456</p>
    </div>
  </div>
</section>
<script>window.CODETRACK_API_URL = "";</script>
<script src="js/login.js"></script>
</body>
</html>
